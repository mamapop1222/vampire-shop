<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vampires Shop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#000;--paper:#fff;--ease:cubic-bezier(.4,0,.15,1)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;overflow-x:hidden}
body{min-height:100vh;animation:pagein 2.4s ease-out both}
@keyframes pagein{from{opacity:0}to{opacity:1}}
#bats{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.bat{position:absolute;left:0;top:0;width:54px;height:30px;will-change:transform}
.bat img{width:100%;height:auto;display:block;animation:flap .32s ease-in-out infinite alternate;transform-origin:50% 50%}
@keyframes flap{from{transform:scale(1,1)}to{transform:scale(.62,.9)}}
.stage{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 40px;transition:opacity 1.12s var(--ease),transform 1.12s var(--ease)}
.stage.hide{opacity:0;transform:scale(.96);pointer-events:none;position:absolute;inset:0}
.castle{position:relative;margin-top:clamp(50px,9vw,80px);--cw:min(70vw,360px);width:var(--cw);cursor:pointer;-webkit-tap-highlight-color:transparent}
.castle img{width:100%;display:block;transition:transform 1.92s var(--ease),filter 1.92s var(--ease);filter:drop-shadow(0 0 0 rgba(0,0,0,0))}
.castle:hover img,.castle.on img{transform:scale(1.04) translateY(-6px);filter:drop-shadow(0 18px 22px rgba(0,0,0,.35))}
.title{position:absolute;left:50%;top:-2%;transform:translate(-50%,-100%);width:max-content;max-width:96vw;margin:0;font-size:clamp(34px,8vw,64px);line-height:1;color:#fff;mix-blend-mode:difference;opacity:0;pointer-events:none;text-align:center;will-change:transform,opacity,filter;animation:rise 6.4s cubic-bezier(.45,.05,.2,1) 0.8s both}
@keyframes rise{0%{transform:translate(-50%,calc(-100% + var(--cw)*1.89));opacity:0;filter:blur(8px)}25%{opacity:1}100%{transform:translate(-50%,-100%);opacity:1;filter:blur(0)}}
.go{margin-top:22px;font-size:24px;line-height:1;color:var(--paper);background:var(--ink);border:2px solid var(--ink);padding:14px 38px;cursor:pointer;opacity:0;transform:translateY(24px);pointer-events:none;transition:opacity 1.44s var(--ease),transform 1.44s var(--ease),background 0.8s var(--ease),color 0.8s var(--ease)}
.stage.reveal .go{opacity:1;transform:none;pointer-events:auto}
.go:hover{background:var(--paper);color:var(--ink)}
.hint{margin-top:14px;font-size:16px;letter-spacing:.25em;text-transform:uppercase;opacity:.45;transition:opacity 0.96s}
.stage.reveal .hint{opacity:0}
.panel{position:absolute;left:0;right:0;top:0;min-height:100vh;padding:56px 20px 60px;display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(40px);pointer-events:none;visibility:hidden;transition:opacity 1.28s var(--ease),transform 1.28s var(--ease),visibility 0s 1.28s}
.panel.show{opacity:1;transform:none;pointer-events:auto;visibility:visible;transition:opacity 1.28s var(--ease) 0.24s,transform 1.28s var(--ease) 0.24s,visibility 0s}
.back{align-self:flex-start;font-size:28px;line-height:1;background:none;border:none;color:var(--ink);cursor:pointer;padding:6px 0;transition:transform 0.64s var(--ease),opacity 0.64s var(--ease)}
.back:hover{transform:translateX(-6px);opacity:.6}
h2{font-size:clamp(40px,8vw,68px);line-height:1;margin:18px 0 34px;text-align:center}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;width:min(1000px,100%)}
.col{background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:44px 20px;text-align:center;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;cursor:pointer;opacity:0;transform:translateY(30px);transition:background 0.96s var(--ease),color 0.96s var(--ease),transform 0.96s var(--ease),box-shadow 0.96s var(--ease),opacity 1.28s var(--ease)}
.panel.show .col{opacity:1;transform:none}
.panel.show .col:nth-child(2){transition-delay:0s,0s,0s,0s,0.24s}
.panel.show .col:nth-child(3){transition-delay:0s,0s,0s,0s,0.48s}
.col:hover{background:var(--ink);color:var(--paper);transform:translateY(-8px);box-shadow:0 22px 30px rgba(0,0,0,.28)}
.col b{font-size:30px;line-height:1;font-weight:400}
.col span{font-size:clamp(44px,5vw,60px);line-height:1}
.coven{margin-top:70px;width:min(1000px,100%)}
.coven h3{font-size:40px;line-height:1;text-align:center;margin:0 0 24px}
.vf svg{display:inline-block;vertical-align:-.15em;height:1em}
.team{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.mem{border-top:2px solid var(--ink);padding:18px 4px;text-align:center;transition:letter-spacing 0.8s var(--ease)}
.mem:hover{letter-spacing:.06em}
.mem b{display:block;font-size:34px;line-height:1.2;font-weight:400;margin-bottom:6px}
a.mem{display:block;color:inherit;text-decoration:none;cursor:pointer;transition:letter-spacing 0.8s var(--ease),background 0.8s var(--ease),color 0.8s var(--ease)}
a.mem:hover{background:var(--ink);color:var(--paper)}
.mem i{opacity:.6;font-size:18px}
.view{display:none;flex-direction:column;align-items:center;gap:30px;margin-top:20px;width:100%}
.view.on{display:flex}
.view.on>*{animation:up 1.76s var(--ease) both}
.view.on>.pic{animation-delay:0.96s}
.view.on>.btn{animation-delay:0.48s}
.view.on>.pic~.btn{animation-delay:3.04s}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.pic{position:relative;width:min(420px,100%);aspect-ratio:560/561;touch-action:none;cursor:crosshair}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none}
.pic .lit{--r:1px;opacity:0;-webkit-mask-image:radial-gradient(circle var(--r) at var(--x,50%) var(--y,50%),#000 0,#000 40%,transparent 100%);mask-image:radial-gradient(circle var(--r) at var(--x,50%) var(--y,50%),#000 0,#000 40%,transparent 100%)}
.btn{font-size:26px;line-height:1;color:var(--paper);background:var(--ink);border:2px solid var(--ink);padding:16px 42px;cursor:pointer;transition:background 0.8s var(--ease),color 0.8s var(--ease)}
.btn:hover{background:var(--paper);color:var(--ink)}
@media(max-width:760px){.cols,.team{grid-template-columns:1fr}.col{min-height:190px;padding:28px 16px}}

</style>
</head>
